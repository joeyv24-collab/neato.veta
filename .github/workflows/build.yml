name: Build VPK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: |
          if command -v apk >/dev/null; then apk add --no-cache git make cmake bash python3 || true; fi
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y git make cmake python3 || true; fi

      - uses: actions/checkout@v4

      - name: Build vitaGL and its dependencies
        shell: bash
        run: |
          set -e
          # the SDK's GCC 15 defaults to C23, which these libraries predate
          OLDC="arm-vita-eabi-gcc -std=gnu17"
          mkdir -p /tmp/deps && cd /tmp/deps
          git clone --depth 1 https://github.com/bythos14/SceShaccCgExt
          (cd SceShaccCgExt && mkdir -p build && cd build && cmake .. -DCMAKE_C_FLAGS="-std=gnu17" && make -j"$(nproc)" install)
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon
          (cd math-neon && make -j"$(nproc)" CC="$OLDC" install)
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK
          (cd vitaShaRK && make -j"$(nproc)" CC="$OLDC" install)
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          (cd vitaGL && make -j"$(nproc)" CC="$OLDC" install)

      - name: Build game
        shell: bash
        run: |
          mkdir -p build && cd build
          cmake .. && make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: neato-vpk
          path: build/neato.vpk

      - name: Publish as a release (download neato.vpk straight from the Releases page)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          body: |
            Install: copy neato.vpk to your Vita and install it with VitaShell.
            Needs ur0:data/libshacccg.suprx (install it with ShaRKBR33D if missing).
            Commit: ${{ github.sha }}
          files: build/neato.vpk
